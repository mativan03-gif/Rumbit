<svg class="pet s1" viewBox="0 0 300 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rumi, mascota de Rumbit">
<style>.e:not(.e-neutral),.evo,.coin-shine{display:none}.shadow{fill:#47308a;opacity:.18}.blush{opacity:.35}.body-bob,.grow{transform:none}</style>
  <defs>
    <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ebe4ff"/></linearGradient>
    <linearGradient id="gScreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d1c66"/><stop offset="1" stop-color="#190e3c"/></linearGradient>
    <radialGradient id="gCoin" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff4b8"/><stop offset=".55" stop-color="#ffd23f"/><stop offset="1" stop-color="#e29a00"/></radialGradient>
    <radialGradient id="gEye" cx=".5" cy=".5" r=".65"><stop offset="0" stop-color="#c4ffee"/><stop offset="1" stop-color="#55e8bd"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="coinClip"><circle cx="150" cy="260" r="19"/></clipPath>
    <clipPath id="clipSadL"><path d="M88 135 L140 119 L140 182 L88 182 Z"/></clipPath>
    <clipPath id="clipSadR"><path d="M212 135 L160 119 L160 182 L212 182 Z"/></clipPath>
    <clipPath id="clipTired"><rect x="88" y="136" width="124" height="50"/></clipPath>
  </defs>

  <ellipse class="shadow" cx="150" cy="318" rx="82" ry="9"/>

  <!-- Evolución 3: aro de energía -->
  <g class="evo evo-3"><circle class="aura" cx="150" cy="190" r="138" fill="none" stroke="#6ff2c8" stroke-width="3" stroke-dasharray="4 11" opacity=".55"/></g>

  <g class="grow">
  <g class="body-bob">

    <!-- Cola -->
    <g class="tail">
      <path d="M196 278 C252 288 282 248 262 206" fill="none" stroke="#cbbaf7" stroke-width="20" stroke-linecap="round"/>
      <path d="M196 278 C252 288 282 248 262 206" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
      <circle cx="262" cy="206" r="9" fill="#6ff2c8" filter="url(#glow)"/>
    </g>

    <!-- Cuerpo -->
    <rect x="92" y="196" width="116" height="102" rx="50" fill="url(#gBody)" stroke="#cbbaf7" stroke-width="3"/>
    <ellipse cx="150" cy="262" rx="38" ry="32" fill="#f1ebff"/>
    <g class="evo evo-3" fill="none" stroke="#6ff2c8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M108 232 H124 L130 238"/><circle cx="105" cy="232" r="2.4" fill="#6ff2c8"/>
      <path d="M106 282 H122"/>
      <path d="M192 232 H176 L170 238"/><circle cx="195" cy="232" r="2.4" fill="#6ff2c8"/>
      <path d="M194 282 H178"/>
    </g>

    <!-- Patitas -->
    <ellipse cx="122" cy="296" rx="22" ry="14" fill="#ffffff" stroke="#cbbaf7" stroke-width="3"/>
    <ellipse cx="178" cy="296" rx="22" ry="14" fill="#ffffff" stroke="#cbbaf7" stroke-width="3"/>
    <path d="M116 299 v7 M128 299 v7 M172 299 v7 M184 299 v7" stroke="#cbbaf7" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Moneda dorada -->
    <g class="coin">
      <circle cx="150" cy="260" r="21" fill="url(#gCoin)" stroke="#c98400" stroke-width="2.5"/>
      <circle cx="150" cy="260" r="15.5" fill="none" stroke="#b87800" stroke-width="1.6" opacity=".55"/>
      <text x="150" y="267" text-anchor="middle" font-family="Fredoka, system-ui, sans-serif" font-weight="700" font-size="20" fill="#8a5a00">R</text>
      <g clip-path="url(#coinClip)"><g transform="rotate(22 150 260)"><rect class="coin-shine" x="112" y="228" width="10" height="64" fill="#ffffff" opacity=".75"/></g></g>
      <circle class="evo evo-4" cx="150" cy="260" r="24" fill="none" stroke="#ffd23f" stroke-width="3" opacity=".85" filter="url(#glow)"/>
    </g>

    <!-- Cabeza -->
    <g class="head">
      <!-- Bigotes (salen por detrás de la cabeza) -->
      <g stroke="#b79cff" stroke-width="3" stroke-linecap="round">
        <path d="M72 150 L30 141"/><path d="M72 162 L26 164"/><path d="M72 174 L32 187"/>
        <path d="M228 150 L270 141"/><path d="M228 162 L274 164"/><path d="M228 174 L268 187"/>
      </g>
      <!-- Orejas -->
      <g class="ear-l">
        <path d="M68 106 L58 40 L122 74 Z" fill="#ffffff" stroke="#cbbaf7" stroke-width="3" stroke-linejoin="round"/>
        <path d="M74 98 L68 57 L108 78 Z" fill="#b79cff" stroke="#b79cff" stroke-width="5" stroke-linejoin="round"/>
      </g>
      <g class="ear-r">
        <path d="M232 106 L242 40 L178 74 Z" fill="#ffffff" stroke="#cbbaf7" stroke-width="3" stroke-linejoin="round"/>
        <path d="M226 98 L232 57 L192 78 Z" fill="#b79cff" stroke="#b79cff" stroke-width="5" stroke-linejoin="round"/>
      </g>
      <!-- Antena -->
      <line x1="150" y1="68" x2="150" y2="42" stroke="#cbbaf7" stroke-width="5" stroke-linecap="round"/>
      <circle class="antenna-ring evo evo-3" cx="150" cy="34" r="13" fill="none" stroke="#6ff2c8" stroke-width="2"/>
      <circle class="antenna-light" cx="150" cy="34" r="8" fill="#6ff2c8" filter="url(#glow)"/>

      <!-- Cara -->
      <rect x="52" y="64" width="196" height="152" rx="66" fill="url(#gBody)" stroke="#cbbaf7" stroke-width="3"/>
      <rect x="72" y="92" width="156" height="100" rx="46" fill="url(#gScreen)"/>
      <ellipse cx="150" cy="104" rx="58" ry="8" fill="#ffffff" opacity=".07"/>
      <rect class="evo evo-2" x="72" y="92" width="156" height="100" rx="46" fill="none" stroke="#6ff2c8" stroke-width="2" opacity=".55" filter="url(#glow)"/>
      <g class="evo evo-2" stroke="#6ff2c8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M62 112 V130 L66 134"/><circle cx="62" cy="108" r="2.2" fill="#6ff2c8"/>
        <path d="M62 170 V182"/><circle cx="62" cy="186" r="2.2" fill="#6ff2c8"/>
        <path d="M238 112 V130 L234 134"/><circle cx="238" cy="108" r="2.2" fill="#6ff2c8"/>
        <path d="M238 170 V182"/><circle cx="238" cy="186" r="2.2" fill="#6ff2c8"/>
      </g>

      <ellipse class="blush" cx="94" cy="166" rx="11" ry="6" fill="#c9a8ff"/>
      <ellipse class="blush" cx="206" cy="166" rx="11" ry="6" fill="#c9a8ff"/>
      <path d="M145 156 L155 156 L150 162 Z" fill="#c9a8ff" stroke="#c9a8ff" stroke-width="2" stroke-linejoin="round"/>

      <!-- Ojos luminosos: uno por expresión -->
      <g class="e e-neutral"><g class="blink">
        <ellipse cx="116" cy="136" rx="17" ry="21" fill="url(#gEye)" filter="url(#glow)"/>
        <ellipse cx="184" cy="136" rx="17" ry="21" fill="url(#gEye)" filter="url(#glow)"/>
        <g class="pupils" id="pupils">
          <ellipse cx="116" cy="138" rx="8.5" ry="12.5" fill="#1a0f3d"/><ellipse cx="184" cy="138" rx="8.5" ry="12.5" fill="#1a0f3d"/>
          <circle cx="112.5" cy="131" r="3.6" fill="#ffffff"/><circle cx="180.5" cy="131" r="3.6" fill="#ffffff"/>
        </g>
      </g></g>

      <g class="e e-happy" fill="none" stroke="#7dffd6" stroke-width="7" stroke-linecap="round" filter="url(#glow)">
        <path d="M97 144 Q116 118 135 144"/><path d="M165 144 Q184 118 203 144"/>
      </g>

      <g class="e e-love" filter="url(#glow)">
        <g transform="translate(116 136)"><path class="heart" d="M0 15 C-28 -3 -14 -27 0 -10 C14 -27 28 -3 0 15 Z" fill="#d6bcff"/></g>
        <g transform="translate(184 136)"><path class="heart" d="M0 15 C-28 -3 -14 -27 0 -10 C14 -27 28 -3 0 15 Z" fill="#d6bcff"/></g>
      </g>

      <g class="e e-wink">
        <ellipse cx="116" cy="136" rx="17" ry="21" fill="url(#gEye)" filter="url(#glow)"/>
        <ellipse cx="116" cy="138" rx="8.5" ry="12.5" fill="#1a0f3d"/><circle cx="112.5" cy="131" r="3.6" fill="#ffffff"/>
        <path d="M167 140 Q184 120 201 140" fill="none" stroke="#7dffd6" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
      </g>

      <g class="e e-surprised">
        <ellipse cx="116" cy="134" rx="19" ry="24" fill="url(#gEye)" filter="url(#glow)"/>
        <ellipse cx="184" cy="134" rx="19" ry="24" fill="url(#gEye)" filter="url(#glow)"/>
        <circle cx="116" cy="136" r="6" fill="#1a0f3d"/><circle cx="184" cy="136" r="6" fill="#1a0f3d"/>
        <circle cx="113.5" cy="132.5" r="2.4" fill="#ffffff"/><circle cx="181.5" cy="132.5" r="2.4" fill="#ffffff"/>
      </g>

      <g class="e e-sad">
        <g clip-path="url(#clipSadL)">
          <ellipse cx="116" cy="138" rx="17" ry="21" fill="url(#gEye)" filter="url(#glow)"/>
          <ellipse cx="116" cy="146" rx="8.5" ry="11" fill="#1a0f3d"/><circle cx="112.5" cy="141" r="3.3" fill="#ffffff"/>
        </g>
        <g clip-path="url(#clipSadR)">
          <ellipse cx="184" cy="138" rx="17" ry="21" fill="url(#gEye)" filter="url(#glow)"/>
          <ellipse cx="184" cy="146" rx="8.5" ry="11" fill="#1a0f3d"/><circle cx="180.5" cy="141" r="3.3" fill="#ffffff"/>
        </g>
      </g>
      <path class="tear" d="M96 160 Q90 170 96 175 Q102 170 96 160 Z" fill="#8fe9ff"/>

      <g class="e e-tired" opacity=".85">
        <g clip-path="url(#clipTired)">
          <ellipse cx="116" cy="140" rx="17" ry="21" fill="url(#gEye)" filter="url(#glow)"/><ellipse cx="116" cy="147" rx="8.5" ry="10" fill="#1a0f3d"/>
          <ellipse cx="184" cy="140" rx="17" ry="21" fill="url(#gEye)" filter="url(#glow)"/><ellipse cx="184" cy="147" rx="8.5" ry="10" fill="#1a0f3d"/>
        </g>
        <path d="M96 136 H136 M164 136 H204" stroke="#7dffd6" stroke-width="3" stroke-linecap="round" opacity=".6"/>
      </g>

      <g class="e e-sleep" fill="none" stroke="#7dffd6" stroke-width="6" stroke-linecap="round" opacity=".7">
        <path d="M99 138 Q116 152 133 138"/><path d="M167 138 Q184 152 201 138"/>
      </g>

      <!-- Bocas -->
      <g class="mo mo-neutral mo-love mo-wink" fill="none" stroke="#7dffd6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M136 168 Q143 177 150 168 Q157 177 164 168"/>
      </g>
      <g class="mo mo-happy">
        <path d="M134 166 Q150 192 166 166 Z" fill="#7dffd6" stroke="#7dffd6" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
        <ellipse cx="150" cy="175.5" rx="6" ry="3.5" fill="#d6bcff"/>
      </g>
      <ellipse class="mo mo-surprised" cx="150" cy="173" rx="6" ry="8" fill="none" stroke="#7dffd6" stroke-width="4"/>
      <path class="mo mo-sad" d="M137 179 Q150 166 163 179" fill="none" stroke="#7dffd6" stroke-width="4" stroke-linecap="round"/>
      <path class="mo mo-tired" d="M139 173 Q145 170 150 173 T161 173" fill="none" stroke="#7dffd6" stroke-width="4" stroke-linecap="round"/>
      <ellipse class="mo mo-sleep" cx="150" cy="172" rx="4.5" ry="3.8" fill="none" stroke="#7dffd6" stroke-width="3.5" opacity=".7"/>

      <!-- Accesorios de cara y cabeza -->
      <g class="acc" data-acc="glasses" fill="rgba(255,255,255,.06)" stroke="#e5d6ff" stroke-width="4">
        <circle cx="116" cy="137" r="27"/><circle cx="184" cy="137" r="27"/>
        <path d="M143 134 Q150 129 157 134" fill="none"/>
        <path d="M89 130 L74 126 M211 130 L226 126" fill="none" stroke-linecap="round"/>
      </g>
      <g class="acc" data-acc="tophat" transform="rotate(-7 150 66)">
        <ellipse cx="150" cy="66" rx="54" ry="9" fill="#4a2a9c"/>
        <path d="M118 66 L121 16 Q150 8 179 16 L182 66 Z" fill="#6d3fe0"/>
        <ellipse cx="150" cy="16" rx="29" ry="6" fill="#8460f2"/>
        <path d="M119.5 56 L180.5 56 L182 66 L118 66 Z" fill="#ffd23f"/>
      </g>
      <g class="acc" data-acc="crown">
        <path d="M110 68 L104 26 L128 46 L150 18 L172 46 L196 26 L190 68 Z" fill="url(#gCoin)" stroke="#c98400" stroke-width="3" stroke-linejoin="round"/>
        <rect x="113" y="58" width="74" height="7" rx="3" fill="#e29a00" opacity=".5"/>
        <circle cx="104" cy="25" r="4.5" fill="#6ff2c8"/><circle cx="150" cy="17" r="5" fill="#d6bcff"/><circle cx="196" cy="25" r="4.5" fill="#6ff2c8"/>
      </g>

      <!-- Evolución 4: aureola -->
      <g class="evo evo-4"><ellipse class="halo" cx="150" cy="9" rx="36" ry="7" fill="none" stroke="#ffd23f" stroke-width="5" filter="url(#glow)"/></g>
    </g><!-- /head -->

    <!-- Collar y accesorios de cuello -->
    <path d="M104 210 Q150 232 196 210" fill="none" stroke="#6ff2c8" stroke-width="8" stroke-linecap="round"/>
    <g class="acc" data-acc="bow">
      <path d="M150 224 L116 208 Q108 222 116 240 Z" fill="#8b5cf6" stroke="#5b2fd0" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M150 224 L184 208 Q192 222 184 240 Z" fill="#8b5cf6" stroke="#5b2fd0" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="150" cy="224" r="8" fill="#a78bfa" stroke="#5b2fd0" stroke-width="2.5"/>
    </g>
    <g class="acc" data-acc="scarf">
      <path d="M100 208 Q150 238 200 208 L203 226 Q150 256 97 226 Z" fill="#5eead4" stroke="#1fb394" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M121 221 L123 238 M143 229 L144 246 M165 229 L166 246 M183 221 L181 238" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
      <path d="M176 238 L198 236 L204 278 L182 282 Z" fill="#5eead4" stroke="#1fb394" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M180 256 L201 254 M181 268 L203 266" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Evolución 4: destellos -->
    <g class="evo evo-4" fill="#ffd23f">
      <g transform="translate(28 100)"><path class="spark" d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z"/></g>
      <g transform="translate(276 118)"><path class="spark d2" d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z"/></g>
      <g transform="translate(34 248)"><path class="spark d3" d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z"/></g>
      <g transform="translate(272 168)"><path class="spark d4" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/></g>
    </g>

    <!-- Zzz mientras recarga -->
    <g class="zzz" fill="#7c4dff" font-family="Fredoka, system-ui, sans-serif" font-weight="700">
      <text x="226" y="80" font-size="22">Z</text><text x="244" y="58" font-size="17">Z</text><text x="258" y="40" font-size="13">Z</text>
    </g>

  </g><!-- /body-bob -->
  </g><!-- /grow -->
</svg>